<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc"><title id="title">Finance chatbot evaluation: research workflow</title><desc id="desc">A schematic of versioned prompts, simulated customer conversations, evaluator scoring, reproducible logs, and human review. This is an in-progress research workflow, not a performance result.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#1B3A5C"/></marker></defs><rect width="1440" height="840" fill="#F7F4EE"/><g font-family="Arial, sans-serif" fill="#23272F"><text x="72" y="78" font-size="18" letter-spacing="2" fill="#1B3A5C">FINANCE CHATBOT EVALUATION</text><text x="72" y="137" font-size="42" font-weight="700">The evaluation pipeline is the research.</text><text x="72" y="179" font-size="22" fill="#5B6268">Do prompt improvements lift every metric, or create trade-offs?</text><line x1="72" y1="214" x2="1368" y2="214" stroke="#C7C9C6"/><text x="72" y="265" font-size="18" fill="#5B6268">01  VERSIONED INPUTS</text><text x="72" y="310" font-size="25" font-weight="700">Scenario + chatbot prompt</text><text x="72" y="346" font-size="20" fill="#5B6268">Frozen baseline, explicit prompt versions</text><line x1="563" y1="301" x2="646" y2="301" stroke="#1B3A5C" stroke-width="3" marker-end="url(#arrow)"/><rect x="692" y="243" width="292" height="136" fill="#FFFFFF" stroke="#1B3A5C"/><text x="716" y="285" font-size="18" fill="#5B6268">CUSTOMER AGENT</text><text x="716" y="327" font-size="24" font-weight="700">Simulated customer</text><line x1="998" y1="305" x2="1059" y2="305" stroke="#1B3A5C" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="1080" y="243" width="288" height="136" fill="#FFFFFF" stroke="#1B3A5C"/><text x="1104" y="285" font-size="18" fill="#5B6268">CHATBOT UNDER TEST</text><text x="1104" y="327" font-size="24" font-weight="700">Financial-services bot</text><path d="M1224 379 V430 H838 V470" fill="none" stroke="#1B3A5C" stroke-width="3" marker-end="url(#arrow)"/><text x="72" y="494" font-size="18" fill="#5B6268">02  EVALUATION + PROVENANCE</text><text x="72" y="539" font-size="25" font-weight="700">Conversation logs → evaluator</text><text x="72" y="575" font-size="20" fill="#5B6268">Structured records, evidence-linked scoring</text><rect x="692" y="490" width="676" height="140" fill="#FFFFFF" stroke="#1B3A5C"/><text x="716" y="532" font-size="24" font-weight="700">Metric-level analysis + human review</text><text x="716" y="568" font-size="20" fill="#5B6268">Audit evidence faithfulness and scoring consistency</text><text x="716" y="600" font-size="20" fill="#5B6268">Preserve failures; structural validity is not behavioral success</text><line x1="72" y1="682" x2="1368" y2="682" stroke="#C7C9C6"/><text x="72" y="728" font-size="21" font-weight="700" fill="#C05B3C">In progress · pilot implementation, not validated comparative findings</text><text x="72" y="766" font-size="18" fill="#5B6268">Python · Gemma / Ollama · Google Colab · Git / GitHub</text><text x="72" y="804" font-size="16" fill="#5B6268">Team: Ellie Choi, Anne Lee, GaHyun Choi · Faculty mentor: Matt Pecsok · Evidence-derived schematic, October 2026</text></g></svg>